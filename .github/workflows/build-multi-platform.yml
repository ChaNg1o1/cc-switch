name: Build Multi Platform

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-build:
    name: Tauri Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: cc-switch-linux
            tauri_args: --bundles appimage,deb,rpm
          - os: windows-2022
            artifact_name: cc-switch-windows
            tauri_args: --bundles msi
          - os: macos-14
            artifact_name: cc-switch-macos
            tauri_args: --bundles app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Prepare CI Tauri config override
        run: |
          node -e "require('fs').writeFileSync('src-tauri/tauri.ci.build.config.json', JSON.stringify({ bundle: { createUpdaterArtifacts: false } }))"

      - name: Build Tauri bundles
        run: pnpm tauri build ${{ matrix.tauri_args }} --config src-tauri/tauri.ci.build.config.json

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          APP_PATH=$(find src-tauri/target -path "*/release/bundle/macos/*.app" -type d | head -1 || true)
          DMG_PATH=$(find src-tauri/target -path "*/release/bundle/dmg/*.dmg" -type f | head -1 || true)

          if [ -n "$APP_PATH" ]; then
            APP_DIR=$(dirname "$APP_PATH")
            APP_NAME=$(basename "$APP_PATH")
            tar -C "$APP_DIR" -czf "artifacts/${APP_NAME}.tar.gz" "$APP_NAME"
          fi

          if [ -n "$DMG_PATH" ]; then
            cp "$DMG_PATH" artifacts/
          fi

          ls -la artifacts

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path 'src-tauri/target' -Recurse -Include *.msi -File | ForEach-Object {
            Copy-Item $_.FullName 'artifacts/'
          }
          Get-ChildItem -Path artifacts

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find src-tauri/target -path '*/release/bundle/*' \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -type f -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
